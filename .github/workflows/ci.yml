name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      # The app reads the root .env (same values as the local services below); compose reads deploy/.env.
      - run: cp .env.example .env && cp deploy/.env.example deploy/.env
      # Same Postgres / Redis / SeaweedFS (+ buckets) as production, from deploy/docker-compose.yml.
      # POSTGRES_PASSWORD overrides deploy/.env so it matches DATABASE_URL in .env.example.
      - run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --wait postgres redis seaweedfs
        env:
          POSTGRES_PASSWORD: rireki
      - run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env run --rm s3-init
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rireki/extractor run setup
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm build
      # Playwright e2e against the built app: migrations and the demo seed first, then the server.
      - run: pnpm --filter @rireki/db migrate:deploy && pnpm --filter @rireki/db seed
      - run: pnpm --filter @rireki/web exec playwright install --with-deps chromium
      - run: echo "127.0.0.1 saoviet.localhost" | sudo tee -a /etc/hosts
      - run: |
          (pnpm --filter @rireki/web start > web.log 2>&1 &)
          curl -sf --retry 30 --retry-connrefused --retry-delay 1 http://localhost:3000/api/health
      - run: pnpm --filter @rireki/web e2e
      - if: failure()
        run: cat web.log

  images:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { app: web, context: ., file: deploy/dockerfiles/web.Dockerfile }
          - { app: worker, context: ., file: deploy/dockerfiles/worker.Dockerfile }
          - { app: extractor, context: apps/extractor, file: deploy/dockerfiles/extractor.Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/bangdh/rireki-${{ matrix.app }}:latest
            ghcr.io/bangdh/rireki-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
