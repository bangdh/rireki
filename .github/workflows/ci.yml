name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rireki
          POSTGRES_PASSWORD: rireki
          POSTGRES_DB: rireki
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rireki -d rireki"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - run: cp .env.example .env
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rireki/extractor run setup
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm build

  images:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { app: web, context: ., file: deploy/dockerfiles/web.Dockerfile }
          - { app: worker, context: ., file: deploy/dockerfiles/worker.Dockerfile }
          - { app: extractor, context: apps/extractor, file: deploy/dockerfiles/extractor.Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/bangdh/rireki-${{ matrix.app }}:latest
            ghcr.io/bangdh/rireki-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
