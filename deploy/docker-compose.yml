# Rireki — full stack in Docker Compose.
#   docker compose up -d                       → infrastructure + Caddy (serves the design mockups at design.${DOMAIN})
#   docker compose --profile app up -d --build → + web / worker / extractor (once apps/ exists)
#   docker compose --profile dev up -d         → + Mailpit (fake SMTP) for local development
#   docker compose --profile prod up -d        → + nightly Postgres backups
name: rireki

x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-production}
  APP_DOMAIN: ${DOMAIN}
  APP_URL: https://${DOMAIN}
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://seaweedfs:8333        # internal (web/worker → SeaweedFS S3 gateway)
  S3_PUBLIC_ENDPOINT: https://s3.${DOMAIN}  # presigned URLs handed to browsers
  S3_REGION: ${S3_REGION:-ap-northeast-1}
  S3_FORCE_PATH_STYLE: "true"               # SeaweedFS; set "false" after moving to AWS S3
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET_ORIGINALS: rireki-originals
  S3_BUCKET_MEDIA: rireki-media
  S3_BUCKET_RENDERS: rireki-renders
  S3_BUCKET_UPLOADS: rireki-uploads
  S3_BUCKET_PUBLIC: rireki-public
  SESSION_SECRET: ${SESSION_SECRET}
  SMTP_URL: ${SMTP_URL}
  MAIL_FROM: ${MAIL_FROM}

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Only the design mockups: never the repo root, which holds deploy/.env (every secret) and .git
      - ../index.html:/srv/design/index.html:ro
      - ../app:/srv/design/app:ro
      - ../viewer:/srv/design/viewer:ro
      - ../public:/srv/design/public:ro
      - ../assets:/srv/design/assets:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      seaweedfs:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"       # local `pnpm dev` / migrations
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"       # local `pnpm dev`
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  seaweedfs:
    # Self-hosted S3 (MinIO community images were withdrawn from Docker Hub in 2026-09 and the last
    # free release has an unpatched auth-bypass CVE). Single node: master + volume + filer + S3 gateway.
    # The app identity is rendered into s3.json at start so the keys stay in .env.
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sed -e "s|__S3_ACCESS_KEY__|$$S3_ACCESS_KEY|" -e "s|__S3_SECRET_KEY__|$$S3_SECRET_KEY|" /etc/seaweedfs/s3.json.tpl > /tmp/s3.json
        && exec weed server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -volume.max=0
        -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    ports:
      - "127.0.0.1:9000:8333"       # S3 API for local `pnpm dev` (same port MinIO used)
    volumes:
      - ./seaweedfs/s3.json.tpl:/etc/seaweedfs/s3.json.tpl:ro
      - seaweeddata:/data
    healthcheck:
      # the S3 gateway answers 403 (no auth) once it is up; 200/403 both mean ready
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8333/ | grep -Eq '^(200|403)$' || wget -qS -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -Eq 'HTTP/[0-9.]+ (200|403)'"]
      interval: 10s
      timeout: 5s
      retries: 10

  s3-init:
    image: amazon/aws-cli:2.37.7
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION:-ap-northeast-1}
      AWS_EC2_METADATA_DISABLED: "true"
      S3_ENDPOINT: http://seaweedfs:8333
    volumes:
      - ./seaweedfs/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]

  migrate:
    profiles: ["app"]
    image: ghcr.io/bangdh/rireki-worker:${IMAGE_TAG:-latest}
    environment:
      <<: *app-env
    working_dir: /app/node_modules/@rireki/db
    command: ["/app/node_modules/.bin/prisma", "migrate", "deploy"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/dockerfiles/web.Dockerfile
    image: ghcr.io/bangdh/rireki-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: "3000"
      RENDER_SECRET: ${RENDER_SECRET:?RENDER_SECRET must be set in deploy/.env (32+ random chars)}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/dockerfiles/worker.Dockerfile
    image: ghcr.io/bangdh/rireki-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WEB_INTERNAL_URL: http://web:3000
      RENDER_SECRET: ${RENDER_SECRET:?RENDER_SECRET must be set in deploy/.env (32+ random chars)}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      EXTRACTOR_URL: http://extractor:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      extractor:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "3"
          memory: 4g
    tmpfs:
      - /tmp:size=4g

  extractor:
    profiles: ["app"]
    build:
      context: ../apps/extractor
      dockerfile: ../../deploy/dockerfiles/extractor.Dockerfile
    image: ghcr.io/bangdh/rireki-extractor:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      S3_ENDPOINT: http://seaweedfs:8333
      S3_REGION: ${S3_REGION:-ap-northeast-1}
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      OCR_LANGS: ${OCR_LANGS:-jpn+eng}
      EXTRACTOR_WORKERS: ${EXTRACTOR_WORKERS:-2}
      OMP_NUM_THREADS: "2"
    depends_on:
      s3-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3g
    tmpfs:
      - /tmp:size=2g

  mailpit:
    profiles: ["dev"]
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"       # web UI
      - "127.0.0.1:1025:1025"       # SMTP (SMTP_URL=smtp://mailpit:1025)

  pgbackup:
    profiles: ["prod"]
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "14"
      BACKUP_KEEP_WEEKS: "8"
      BACKUP_KEEP_MONTHS: "6"
    volumes:
      - pgbackups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  seaweeddata:
  caddy_data:
  caddy_config:
  pgbackups:
