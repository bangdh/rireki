# Rireki — full stack in Docker Compose.
#   docker compose up -d                       → infrastructure + Caddy (serves the design mockups at design.${DOMAIN})
#   docker compose --profile app up -d --build → + web / api / worker (once apps/ exists)
#   docker compose --profile dev up -d         → + Mailpit (fake SMTP) for local development
#   docker compose --profile prod up -d        → + nightly Postgres backups
name: rireki

x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-production}
  APP_DOMAIN: ${DOMAIN}
  APP_URL: https://${DOMAIN}
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000            # internal (API/worker → MinIO)
  S3_PUBLIC_ENDPOINT: https://s3.${DOMAIN}  # presigned URLs handed to browsers
  S3_REGION: ${S3_REGION:-ap-northeast-1}
  S3_FORCE_PATH_STYLE: "true"               # MinIO; set "false" after moving to AWS S3
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET_ORIGINALS: rireki-originals
  S3_BUCKET_MEDIA: rireki-media
  S3_BUCKET_RENDERS: rireki-renders
  S3_BUCKET_UPLOADS: rireki-uploads
  S3_BUCKET_PUBLIC: rireki-public
  SESSION_SECRET: ${SESSION_SECRET}
  SMTP_URL: ${SMTP_URL}
  MAIL_FROM: ${MAIL_FROM}

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ..:/srv/design:ro            # the design mockups (index.html, app/, viewer/ …)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      minio:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    ports:
      - "127.0.0.1:9001:9001"       # admin console, reach it through an SSH tunnel
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - ./minio/init.sh:/init.sh:ro
      - ./minio/app-policy.json:/app-policy.json:ro
    entrypoint: ["/bin/sh", "/init.sh"]

  web:
    profiles: ["app"]
    build:
      context: ../apps/web
      dockerfile: ../../deploy/dockerfiles/web.Dockerfile
    image: ghcr.io/bangdh/rireki-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *app-env
      API_INTERNAL_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy

  api:
    profiles: ["app"]
    build:
      context: ../apps/api
      dockerfile: ../../deploy/dockerfiles/api.Dockerfile
    image: ghcr.io/bangdh/rireki-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    profiles: ["app"]
    build:
      context: ../apps/worker
      dockerfile: ../../deploy/dockerfiles/worker.Dockerfile
    image: ghcr.io/bangdh/rireki-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "3"
          memory: 4g
    tmpfs:
      - /tmp:size=4g

  mailpit:
    profiles: ["dev"]
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"       # web UI
      - "127.0.0.1:1025:1025"       # SMTP (SMTP_URL=smtp://mailpit:1025)

  pgbackup:
    profiles: ["prod"]
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "14"
      BACKUP_KEEP_WEEKS: "8"
      BACKUP_KEEP_MONTHS: "6"
    volumes:
      - pgbackups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddy_data:
  caddy_config:
  pgbackups:
